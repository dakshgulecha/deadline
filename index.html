<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Deadline" />
    <title>Deadline</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell" id="app-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark"></span><span>Deadline</span></div>
        <div class="topbar-center" id="today-label"></div>
        <div class="topbar-actions">
          <button class="icon-button theme-toggle" id="toggle-theme" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="icon-moon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <svg class="icon-sun" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.5 3.5l1.05 1.05M11.45 11.45l1.05 1.05M3.5 12.5l1.05-1.05M11.45 4.55l1.05-1.05" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-button notes-toggle" id="toggle-notes" type="button" aria-label="Hide notes" title="Hide notes">◧</button>
          <button class="add-deadline-button" id="show-deadline-form" type="button" aria-expanded="false" aria-controls="deadline-form"><span class="add-label">Add deadline</span><span class="add-plus" aria-hidden="true">+</span></button>
        </div>
      </header>

      <section class="workspace" id="workspace" data-view="deadlines">
        <section class="tracker-panel" aria-label="Deadline tracker">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">YOUR DEADLINES</p>
              <h1>What needs your attention.</h1>
            </div>
            <span class="item-count" id="deadline-count"></span>
          </div>

          <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
          <form class="deadline-form" id="deadline-form" aria-label="New deadline" novalidate hidden>
            <span class="sheet-grabber" aria-hidden="true"></span>
            <p class="sheet-title">New deadline</p>
            <div class="form-grid">
              <label>Title<input id="new-deadline-title" type="text" placeholder="e.g. UCAS application" enterkeyhint="next" /></label>
              <label>Date<input id="new-deadline-date" type="date" /></label>
              <label data-only="standard">Institution<input id="new-deadline-institution" type="text" placeholder="Institution or board" /></label>
              <label data-only="reminder" hidden>Time <em>(optional)</em><input id="new-deadline-time" type="time" /></label>
              <label>Type
                <select id="new-deadline-category">
                  <option value="registration">Registration deadline</option>
                  <option value="testRegistration">Test registration deadline</option>
                  <option value="application">Application deadline</option>
                  <option value="test">Test date</option>
                  <option value="reminder">Reminder</option>
                </select>
              </label>
              <label class="wide" data-only="standard">Details<textarea id="new-deadline-details" placeholder="What needs to happen?"></textarea></label>
              <label class="wide" data-only="standard">Link<input id="new-deadline-link" type="url" inputmode="url" placeholder="https://" autocapitalize="off" /></label>
              <label class="wide">Notes<textarea id="new-deadline-notes" placeholder="Anything useful to remember?"></textarea></label>
            </div>
            <p class="form-error" id="deadline-form-error" hidden></p>
            <div class="form-actions"><button class="text-button" id="cancel-deadline" type="button">Cancel</button><button class="primary-button" id="save-deadline" type="submit">Save deadline</button></div>
          </form>

          <div class="deadline-list" id="deadline-list"></div>
        </section>

        <div class="resize-handle" id="resize-handle" role="separator" aria-label="Resize tracker and notes" aria-orientation="vertical" aria-valuemin="38" aria-valuemax="68" aria-valuenow="56" tabindex="0"></div>

        <aside class="notes-panel" id="notes-panel" data-mode="list" aria-label="Notes workspace">
          <div class="notes-heading">
            <div>
              <p class="eyebrow">PERSONAL WORKSPACE</p>
              <h2>Notes</h2>
            </div>
            <span class="save-status" id="save-status" role="status">Connecting…</span>
          </div>
          <div class="notes-workspace">
            <nav class="note-list" aria-label="Your notes">
              <div class="note-rows" id="note-rows"></div>
              <input class="new-note-field" id="new-note-field" placeholder="Write a new note…" aria-label="Create a new note" enterkeyhint="done" />
            </nav>
            <section class="note-editor" id="note-editor">
              <div class="editor-empty" id="editor-empty">Choose a note to begin.</div>
              <div class="editor-content" id="editor-content" hidden>
                <button class="note-back" id="note-back" type="button"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Notes</button>
                <input class="note-title-input" id="note-title" aria-label="Note title" placeholder="Untitled note" />
                <div class="editor-meta"><span id="note-date"></span><button class="delete-note" id="delete-note" type="button">Delete</button></div>
                <div class="editor-tools" role="toolbar" aria-label="Note formatting">
                  <button type="button" class="format-button" id="bullet-list" title="Bulleted list" aria-label="Bulleted list">• List</button>
                  <button type="button" class="format-button" id="checklist" title="Checklist" aria-label="Checklist">☐ Check</button>
                </div>
                <div id="note-body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note body" data-placeholder="Start writing…"></div>
              </div>
            </section>
          </div>
        </aside>
      </section>

      <nav class="tab-bar" aria-label="Sections">
        <button class="tab" type="button" data-view="deadlines" aria-pressed="true">
          <svg viewBox="0 0 20 20" width="19" height="19" aria-hidden="true"><path d="M4 5.5h1.5M8 5.5h8M4 10h1.5M8 10h8M4 14.5h1.5M8 14.5h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Deadlines</span>
        </button>
        <button class="tab" type="button" data-view="notes" aria-pressed="false">
          <svg viewBox="0 0 20 20" width="19" height="19" aria-hidden="true"><path d="M5 3.5h7l3 3v10H5z M12 3.5v3h3 M7.5 10h5M7.5 13h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span>Notes</span>
        </button>
      </nav>
    </main>

    <div class="lock-screen" id="lock-screen" hidden>
      <form class="lock-card" id="lock-form">
        <div class="brand"><span class="brand-mark"></span><span>Deadline</span></div>
        <h2>Unlock this device</h2>
        <p>Enter your passphrase once. This browser will stay unlocked after that.</p>
        <input id="lock-input" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passphrase" aria-label="Passphrase" enterkeyhint="go" />
        <p class="lock-error" id="lock-error" role="alert" hidden></p>
        <button class="primary-button" id="lock-submit" type="submit">Unlock</button>
      </form>
    </div>

    <template id="deadline-template">
      <article class="deadline-item">
        <div class="deadline-track">
          <button class="swipe-delete" type="button">Delete</button>
          <div class="deadline-slide">
            <button class="deadline-row" type="button">
              <span class="completion" aria-hidden="true"></span>
              <time class="deadline-date"></time>
              <span class="deadline-main"><strong></strong><small></small></span>
              <span class="deadline-type"></span>
              <span class="countdown"></span>
              <span class="chevron" aria-hidden="true"><svg viewBox="0 0 16 16" width="10" height="10"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </button>
            <button class="row-delete" type="button" aria-label="Delete deadline" title="Delete deadline"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.8 4.4h10.4M6.4 4.4V2.9h3.2v1.5M4.2 4.4l.55 8.4h6.5l.55-8.4M6.7 7v3.8M9.3 7v3.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
        <div class="deadline-details" hidden></div>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
